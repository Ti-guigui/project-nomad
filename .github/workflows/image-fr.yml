name: Construire l'image Docker (version française)

# Construit l'image de NOMAD en français et la publie sur
# ghcr.io/<propriétaire>/project-nomad:latest, l'image utilisée par
# install/management_compose.yaml. Se lance à chaque modification de
# l'application sur main, ou manuellement depuis l'onglet « Actions ».
# Publie ensuite la release « v<version> » si elle n'existe pas encore : c'est
# elle que NOMAD consulte pour savoir si une mise à jour est disponible.
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'Dockerfile'
      - 'install/entrypoint.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Nom de l'image
        id: image
        run: |
          echo "nom=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project-nomad" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Connexion au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ steps.image.outputs.nom }}:latest
            ${{ steps.image.outputs.nom }}:${{ steps.image.outputs.version }}-fr
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Publier la release de version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v${VERSION} existe déjà."
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest \
              --title "Project NOMAD ${VERSION} (version française)" \
              --notes "Image Docker : ${{ steps.image.outputs.nom }}:${VERSION}-fr (également publiée sous :latest)."
          fi
